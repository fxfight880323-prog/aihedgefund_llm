# 有锐度的均衡 — 章宏帆轮动策略（L1 分类 + L2 环节稀缺度 + L4 构造器）
# alpha model = rotation_growth；blend = balanced_sharpness
#
# 类与环节信息经 Signal.metadata 流向构造器：方向权重按 S 分单调分配
# （top≈16% → tail≈7%），类配比 A≤55%/B≤30%/C≤5%，单票上限 5%，
# 自下而上非主题 sleeve ≤10%。

name: rotation-growth
display_name: 有锐度的均衡 · 轮动
models:
  - name: rotation_growth
    weight: 1.0
    params:
      # L1 分类阈值（渗透率用营收增速代理）
      boom_growth: 0.50          # A 景气成长：高增长门槛
      emerging_growth: 1.50      # C 新兴成长：极端增长
      emerging_max_gm: 15.0      # C：毛利率弱（无利润）
      off_theme_roe: 15.0        # 自下而上 sleeve 门槛
      off_theme_gm: 30.0
      # 类则估值
      b_class_pe_ceiling: 20.0   # B 类 PE 上限（超限 → 负信念=减仓轮出）
      upside_hurdle: 0.30        # A 类 3 年空间代理门槛
      # G5 泡沫检验
      g5_pe_dominance: 0.30      # ΔPE 主导判定
      # L5 AI 周期仪表盘（bullish/neutral/bearish；≥2/3 领先指标转熊
      # → A 类信念减半）。默认中性，数据源接入后更新。
      ai_dashboard:
        frontier_models: neutral   # 前沿模型迭代
        frontier_arr: neutral      # 前沿实验室 ARR 斜率
        cloud_roi: neutral         # 云收入 vs 算力 ROI
        h100_rental: neutral       # V1 H100 租金
        lta_deposits: neutral      # V2 长约+预付款
        token_mom: neutral        # V3 token 消耗 MoM
      # 环节稀缺度表（整体覆盖默认 2026 快照；此处示例注释）
      # link_map:
      #   光模块/光通信: {s_scores: [2,2,2,1,2], keywords: [光模块, 光通信, 光器件]}
blend:
  method: balanced_sharpness
  gross_target: 0.90          # 隐式 10% 现金
  market_neutral: false
  params:
    top_direction_weight: 0.16
    tail_direction_weight: 0.07
    max_directions: 6
    class_mix: {A: 0.55, B: 0.30, C: 0.05}
    per_name_cap: 0.05
    off_theme_sleeve: 0.10
