# BSADF + technical confluence — layered bubble timing.
# BSADF detects the statistical bubble regime (bullish ride / bearish burst);
# tech_confluence supplies mechanical exit timing (MACD/RSI/Chandelier/volume)
# inside the FADING window. See research_sell_signals.md.
#
# Blend: 70% BSADF regime view + 30% confluence exit timing.

name: bsadf-confluence
display_name: BSADF+共振 择时
models:
  - name: bsadf
    weight: 0.7
    params:
      window: 160
      n_sim: 2000
      ride_bubble: true
      fear_strength: 0.5
  - name: tech_confluence
    weight: 0.3
    params:
      lookback_days: 250
      strong_threshold: 3.0    # score ≥ 3 → -1.0
      mid_threshold: 2.0       # score ≥ 2 → -0.5
      weak_threshold: 1.0      # score ≥ 1 → -0.25
blend:
  method: conviction_weighted
  gross_target: 1.0
  market_neutral: false
